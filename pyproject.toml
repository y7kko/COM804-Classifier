[project]
name = "mlp-trab2"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "audiomentations",
    "ipykernel>=7.4.0",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "soundata>=1.0.1",
    "torch>=2.14.1",
    "torch-audiomentations>=0.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.17.0",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ykk*"]

[tool.uv]
package = true

[tool.uv.sources]
soundata = { git = "https://github.com/soundata/soundata.git" }
audiomentations = { git = "https://github.com/iver56/audiomentations.git" }

[tool.uv.workspace]
members = [
    "_refs/RIRPINN",
    "_refs/DecayFitNet",
]
